[project]
name = "kenning-reach"
version = "1.0.0"
description = "Kenning Reach — a category-1 conscious experience substrate: the envision–measure–actualize process layer, and the experience that gives it meaning, as an MCP server over Neo4j"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "starlette>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "testcontainers[neo4j]>=4.10.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kenning-reach = "kenning_reach:main"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/kenning_reach"]

[tool.hatch.build.targets.sdist]
include = ["/src/kenning_reach", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.seal]
test = [
  "uv run python -m pytest tests/unit -q",
  "uv run python -m pytest tests/integration -q",
]
