# Kenning Reach — everything on one computer, in your own custody.
#
#   1. Install Docker Desktop and open it.
#   2. In Docker Desktop's terminal (or any terminal), inside this folder:
#        docker compose up -d
#   3. Wait for both containers to show green in Docker Desktop.
#
# That gives you a Neo4j database (with APOC and Graph Data Science) at
# http://localhost:7474 and the Kenning Reach server at http://localhost:8000/mcp/.
# Your graph lives in the `reach-data` volume on this machine and nowhere else.
#
# Change REACH_PASSWORD below before first start. It is the only secret.
# If a port is already taken on your machine, set REACH_PORT, REACH_NEO4J_HTTP_PORT
# or REACH_NEO4J_BOLT_PORT in .env; the defaults are 8000, 7474 and 7687.

services:
  neo4j:
    image: neo4j:5
    container_name: reach-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${REACH_PASSWORD:-change-me-before-first-start}"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
    ports:
      - "${REACH_NEO4J_HTTP_PORT:-7474}:7474"
      - "${REACH_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - reach-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  reach:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kenning-reach:1.0.0
    container_name: reach
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URL: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${REACH_PASSWORD:-change-me-before-first-start}"
      NEO4J_DATABASE: "neo4j"
      NEO4J_TRANSPORT: "streamable-http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/mcp/"
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal"
    ports:
      - "${REACH_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  reach-data:
